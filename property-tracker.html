<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房產追蹤清單</title><style>
body{margin:0;background:#f5f3ed;color:#18211c;font:15px/1.6 system-ui,"Noto Sans TC",sans-serif}.wrap{width:min(1250px,calc(100% - 28px));margin:36px auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}h1{margin:0;font-size:34px}p{color:#69736d}button,a.btn{border:0;border-radius:9px;padding:10px 14px;background:#1e5b45;color:#fff;text-decoration:none;cursor:pointer;font-weight:700}.alt{background:#fff!important;color:#1e5b45!important;border:1px solid #1e5b45!important}.card{background:white;border:1px solid #dce2dd;border-radius:16px;padding:18px;margin-top:20px;box-shadow:0 12px 35px #173e3010}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{border-bottom:1px solid #e1e5e2;padding:11px 9px;text-align:left;vertical-align:top}th{color:#66736c;background:#fafbf9}td[contenteditable=true]{background:#fffdf5;outline:none}select,input{padding:8px;border:1px solid #cad2cd;border-radius:7px}small{color:#68736c}.actions{display:flex;gap:8px;flex-wrap:wrap}.del{background:#a5483f}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#dfeee7;color:#1e5b45}</style></head><body><div class="wrap"><div class="top"><div><span class="badge">Project 20260912001</span><h1>房產追蹤清單</h1><p>欄位可直接點擊編輯；狀態與備註會儲存在此瀏覽器。重要更新後請匯出 CSV 備份。</p></div><div class="actions"><a class="btn alt" href="project20260912001.html">楠梓報告</a><a class="btn alt" href="nanfeng-150-2-3f.html">南豐街報告</a><button onclick="addRow()">新增物件</button><button onclick="exportCSV()">匯出 CSV</button><button class="alt" onclick="resetData()">還原初始資料</button></div></div><div class="card table"><table><thead><tr><th>狀態</th><th>地址／物件</th><th>刊登價</th><th>合理價帶</th><th>目標價</th><th>開價變動</th><th>最後更新</th><th>待辦</th><th>備註</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p><small>提示：出售物件可使用「準備出售 → 已刊登 → 帶看中 → 議價中 → 成交」。</small></p></div><script>
const key='re-tracker-20260912001',migrationKey=key+'-nanfeng-v3';const seed=[{status:'查文件',name:'高雄市楠梓區清豐路78巷7號｜9880VQ',ask:'1,898萬',range:'1,820–1,910萬',target:'1,800–1,850萬',change:'原價1,998萬 → -5.01%',updated:'2026-09-12',todo:'謄本、使用執照、增建圖、驗屋、銀行鑑價',note:'價格合理但非便宜；1,890萬為條件式上限'},{status:'準備出售',name:'桃園市桃園區南豐街150-2號3F',ask:'938萬',range:'790–910萬',target:'835–890萬',change:'依32點多坪及土地15坪更新',updated:'2026-09-12',todo:'確認精確權狀小數、測量成果圖、漏水管線查核、清空拍照',note:'屋主確認權狀32點多坪、土地15坪；150系列無公開實價；不採148系列'}];let data=JSON.parse(localStorage.getItem(key)||'null')||seed;if(!localStorage.getItem(migrationKey)){const existing=data.findIndex(r=>r.name&&r.name.includes('南豐街150-2號'));if(existing<0){data.push(seed[1])}else{data[existing]=seed[1]}localStorage.setItem(key,JSON.stringify(data));localStorage.setItem(migrationKey,'1')}
function save(){localStorage.setItem(key,JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){document.querySelector('#rows').innerHTML=data.map((r,i)=>`<tr><td><select onchange="upd(${i},'status',this.value)">${['觀察中','準備出售','已刊登','帶看中','議價中','查文件','已看屋','成交','放棄'].map(x=>`<option ${x==r.status?'selected':''}>${x}</option>`).join('')}</select></td>${['name','ask','range','target','change','updated','todo','note'].map(k=>`<td contenteditable="true" onblur="upd(${i},'${k}',this.innerText)">${esc(r[k])}</td>`).join('')}<td><button class="del" onclick="removeRow(${i})">刪除</button></td></tr>`).join('')}
function upd(i,k,v){data[i][k]=v.trim();save()}function addRow(){data.push({status:'觀察中',name:'新物件',ask:'',range:'',target:'',change:'',updated:new Date().toISOString().slice(0,10),todo:'',note:''});save();render()}function removeRow(i){if(confirm('確定刪除此筆？')){data.splice(i,1);save();render()}}function resetData(){if(confirm('確定還原初始清單？目前瀏覽器內的編輯會被取代。')){data=JSON.parse(JSON.stringify(seed));save();render()}}
function exportCSV(){const headers=['狀態','地址／物件','刊登價','合理價帶','目標價','開價變動','最後更新','待辦','備註'];const keys=['status','name','ask','range','target','change','updated','todo','note'];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[headers.map(q).join(','),...data.map(r=>keys.map(k=>q(r[k])).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='property-tracker-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)}render();
</script></body></html>
