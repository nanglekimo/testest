<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="集中檢視房地產、股市投資與早期前端作品的專案總覽。">
  <title>專案作品總覽</title>
  <style>
    :root {
      --bg: #f4f5f2; --surface: #fff; --surface-muted: #eef0ec; --ink: #171b18;
      --muted: #626a64; --line: #d8ddd7; --accent: #23634d;
      --property: #9a4f32; --property-soft: #f2e5df;
      --market: #245b86; --market-soft: #e0eaf2;
      --episode: #7b3f75; --episode-soft: #eee1ec;
      --archive: #6b5630; --archive-soft: #eee8dc;
      --shadow: 0 10px 28px rgba(23, 27, 24, .08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; min-height: 100vh; color: var(--ink); background: var(--bg); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    .shell { width: min(1440px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 56px; }
    .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; padding: 18px 0 24px; border-bottom: 1px solid var(--line); }
    .heading { min-width: 0; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; letter-spacing: 0; }
    .intro { max-width: 760px; margin: 12px 0 0; color: var(--muted); font-size: 15px; line-height: 1.75; }
    .summary { display: flex; flex: 0 0 auto; gap: 8px; }
    .summary-item { min-width: 92px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
    .summary-item strong { display: block; font-size: 24px; line-height: 1; }
    .summary-item span { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }
    .controls { position: sticky; z-index: 10; top: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 360px); gap: 16px; align-items: center; padding: 16px 0; background: rgba(244, 245, 242, .94); backdrop-filter: blur(12px); }
    .tabs { display: flex; min-width: 0; gap: 6px; overflow-x: auto; scrollbar-width: thin; }
    .tab { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 9px 14px; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 6px; font-weight: 750; white-space: nowrap; cursor: pointer; }
    .tab:hover { background: var(--surface-muted); }
    .tab[aria-selected="true"] { color: #fff; background: var(--ink); border-color: var(--ink); }
    .tab-count { min-width: 22px; padding: 2px 6px; color: currentColor; background: rgba(255, 255, 255, .18); border-radius: 999px; font-size: 11px; text-align: center; }
    .search-wrap { position: relative; }
    .search-wrap::before { content: "⌕"; position: absolute; top: 50%; left: 14px; color: var(--muted); font-size: 20px; transform: translateY(-53%); pointer-events: none; }
    .search { width: 100%; min-height: 42px; padding: 10px 40px 10px 42px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; outline: none; }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(35, 99, 77, .12); }
    .clear-search { position: absolute; top: 50%; right: 8px; display: none; width: 28px; height: 28px; padding: 0; color: var(--muted); background: transparent; border: 0; border-radius: 50%; font-size: 20px; line-height: 1; cursor: pointer; transform: translateY(-50%); }
    .clear-search:hover { background: var(--surface-muted); }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 8px 0 16px; }
    .section-head h2 { margin: 0; font-size: 23px; letter-spacing: 0; }
    .section-head p { margin: 5px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .result-count { flex: 0 0 auto; color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .project { display: flex; min-width: 0; flex-direction: column; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .preview { position: relative; height: 220px; overflow: hidden; background: #e5e8e4; border-bottom: 1px solid var(--line); }
    .preview iframe { width: 1440px; height: 900px; border: 0; background: #fff; pointer-events: none; transform: scale(.24); transform-origin: top left; }
    .preview-status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); background: #e9ece8; font-size: 13px; }
    .preview.loaded .preview-status { display: none; }
    .project-body { display: flex; flex: 1; flex-direction: column; padding: 17px; }
    .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
    .type { display: inline-flex; align-items: center; min-height: 25px; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; }
    .type.property { color: var(--property); background: var(--property-soft); }
    .type.market { color: var(--market); background: var(--market-soft); }
    .type.episode { color: var(--episode); background: var(--episode-soft); }
    .type.archive { color: var(--archive); background: var(--archive-soft); }
    .filename { min-width: 0; overflow: hidden; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .project h3 { margin: 0; font-size: 19px; line-height: 1.35; letter-spacing: 0; }
    .description { margin: 9px 0 14px; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: auto 0 15px; }
    .tag { padding: 5px 7px; color: var(--muted); background: var(--surface-muted); border-radius: 4px; font-size: 11px; }
    .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 39px; padding: 9px 12px; border-radius: 5px; font-size: 13px; font-weight: 800; }
    .button.primary { color: #fff; background: var(--ink); }
    .button.secondary { color: var(--ink); background: var(--surface-muted); border: 1px solid var(--line); }
    .button:hover { filter: brightness(.94); }
    .empty { display: none; padding: 52px 20px; color: var(--muted); background: var(--surface); border: 1px dashed #b9c0ba; border-radius: 8px; text-align: center; }
    .empty strong { display: block; margin-bottom: 6px; color: var(--ink); font-size: 17px; }
    @media (max-width: 1080px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .controls { grid-template-columns: 1fr; } }
    @media (max-width: 720px) {
      .shell { width: min(100% - 24px, 1440px); padding-top: 10px; }
      .topbar { align-items: stretch; flex-direction: column; gap: 18px; }
      .summary { display: grid; grid-template-columns: repeat(2, 1fr); }
      .summary-item { min-width: 0; }
      .controls { padding: 12px 0; }
      .tabs { padding-bottom: 2px; }
      .section-head { align-items: flex-start; flex-direction: column; gap: 8px; }
      .grid { grid-template-columns: 1fr; }
      .preview { height: 205px; }
      .preview iframe { transform: scale(.20); }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="heading">
        <p class="eyebrow">Project Library</p>
        <h1>專案作品總覽</h1>
        <p class="intro">將房地產分析、股市投資研究、股癌 EP 內容與早期前端作品分區管理。切換頁籤即可檢視該主題的全部頁面，並可直接開啟完整作品。</p>
      </div>
      <div class="summary" aria-label="專案統計">
        <div class="summary-item"><strong id="totalCount">0</strong><span>全部頁面</span></div>
        <div class="summary-item"><strong id="groupCount">0</strong><span>主題分類</span></div>
      </div>
    </header>

    <section class="controls" aria-label="作品瀏覽工具">
      <div class="tabs" id="tabs" role="tablist" aria-label="作品分類"></div>
      <div class="search-wrap">
        <input class="search" id="searchInput" type="search" placeholder="搜尋目前分類的名稱、說明或檔名" autocomplete="off">
        <button class="clear-search" id="clearSearch" type="button" aria-label="清除搜尋" title="清除搜尋">×</button>
      </div>
    </section>

    <section aria-live="polite">
      <div class="section-head">
        <div><h2 id="sectionTitle"></h2><p id="sectionDescription"></p></div>
        <span class="result-count" id="resultCount"></span>
      </div>
      <div class="grid" id="projectGrid"></div>
      <div class="empty" id="emptyState"><strong>找不到符合的頁面</strong>請換一個關鍵字，或切換到其他分類。</div>
    </section>
  </main>

  <script>
    const groups = {
      property: { label: "房地產", description: "房價評估、物件追蹤、銷售策略與貸款試算集中於此。" },
      market: { label: "股市與投資", description: "個股研究、財報查證、投資框架與資金配置工具集中於此。" },
      episode: { label: "股癌專區", description: "所有以 EP 開頭的股癌內容與互動式簡報集中於此。" },
      archive: { label: "舊作品集", description: "早期前端作業、互動原型與個人展示頁集中於此。" }
    };

    const projects = [
      { title: "南豐街 150-2 號 3 樓", file: "nanfeng-150-2-3f.html", group: "property", type: "售價評估", description: "桃園區住宅物件的售價評估與銷售策略，整理行情、價格帶與執行建議。", tags: ["桃園住宅", "售價策略", "市場比較"] },
      { title: "清豐路 78 巷 7 號", file: "project20260912001.html", group: "property", type: "物件分析", description: "透天物件的價格與風險評估，整合區域行情、物件條件與判斷依據。", tags: ["透天厝", "價格評估", "風險分析"] },
      { title: "房產追蹤清單", file: "property-tracker.html", group: "property", type: "管理工具", description: "用表格集中追蹤房產標的、價格與狀態，方便持續整理候選物件。", tags: ["物件追蹤", "清單管理", "本機工具"] },
      { title: "貸款月付金試算器", file: "LoanCalculator.html", group: "property", type: "貸款工具", description: "依貸款金額、年利率與期數計算月付金、總還款與利息，並支援 CSV 匯出。", tags: ["房貸試算", "本息攤還", "CSV 匯出"] },
      { title: "TSLA × SPCX × Optimus 投資框架", file: "TSLA_SPCX_Optimus_投資框架_查證版.html", group: "market", type: "投資框架", description: "以查證版架構拆解 Tesla、SpaceX 與 Optimus 的關聯、敘事與投資判斷。", tags: ["Tesla", "SpaceX", "Optimus"] },
      { title: "EP701 市場主線總覽", file: "EP701.html", group: "episode", type: "股癌 EP", description: "從個股、AI 產業鏈與多重市場敘事切入的互動式重點整理。", tags: ["EP701", "AI 產業鏈", "市場敘事"] },
      { title: "EP700 個股與 AI 產業鏈", file: "EP700.html", group: "episode", type: "股癌 EP", description: "整理個股觀察與 AI 產業鏈互動關係，提供分段式研究檢視。", tags: ["EP700", "個股研究", "AI 產業鏈"] },
      { title: "IBKR 韓元借款利息驗證", file: "IBKR_KRW_interest_visual_report_20260804.html", group: "market", type: "查證報告", description: "針對 IBKR 韓元借款利息與相關計算進行視覺化驗證與說明。", tags: ["IBKR", "韓元借款", "利息驗證"] },
      { title: "SK hynix Q2 2026｜ChatGPT 版", file: "SK_hynix_Q2_2026_chatgpt.html", group: "market", type: "財報分析", description: "涵蓋完整財報、EPS、本益比與預測情境的 SK hynix 研究版本。", tags: ["SK hynix", "Q2 2026", "Forecast"] },
      { title: "SK hynix Q2 2026｜Claude 版", file: "SKhynix_Q2_2026_claude.html", group: "market", type: "財報分析", description: "SK hynix 2026 年第二季財報查證與市場分析的另一份比較版本。", tags: ["SK hynix", "財報查證", "版本比較"] },
      { title: "投資現金水位管理", file: "investment_cash_manager.html", group: "market", type: "配置工具", description: "依市場週期評分估算現金、債券與股票配置比例，並保存本機設定。", tags: ["資產配置", "現金水位", "本機儲存"] },
      { title: "數位財金公會認證中心", file: "login.html", group: "archive", type: "登入原型", description: "深色風格的登入與註冊介面，展示數位財金主題的認證流程。", tags: ["登入註冊", "介面原型", "深色 UI"] },
      { title: "LinkedIn 風格個人履歷", file: "resume.html", group: "archive", type: "展示頁", description: "包含個人簡介、經歷、學歷、專案與技能的履歷展示頁。", tags: ["個人履歷", "專案展示", "互動內容"] }
    ];

    const tabs = document.getElementById("tabs");
    const grid = document.getElementById("projectGrid");
    const searchInput = document.getElementById("searchInput");
    const clearSearch = document.getElementById("clearSearch");
    const emptyState = document.getElementById("emptyState");
    const sectionTitle = document.getElementById("sectionTitle");
    const sectionDescription = document.getElementById("sectionDescription");
    const resultCount = document.getElementById("resultCount");
    let activeGroup = "property";

    document.getElementById("totalCount").textContent = projects.length;
    document.getElementById("groupCount").textContent = Object.keys(groups).length;

    function renderTabs() {
      tabs.innerHTML = Object.entries(groups).map(([key, group]) => {
        const count = projects.filter(project => project.group === key).length;
        return `<button class="tab" type="button" role="tab" data-group="${key}" aria-selected="${key === activeGroup}" aria-controls="projectGrid">${group.label}<span class="tab-count">${count}</span></button>`;
      }).join("");
      tabs.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
          activeGroup = tab.dataset.group;
          searchInput.value = "";
          updateClearButton();
          renderTabs();
          renderProjects();
        });
      });
    }

    function cardTemplate(project) {
      return `<article class="project">
        <div class="preview"><span class="preview-status">正在載入預覽…</span><iframe data-src="${project.file}" title="${project.title} 預覽" loading="lazy"></iframe></div>
        <div class="project-body">
          <div class="meta"><span class="type ${project.group}">${project.type}</span><span class="filename" title="${project.file}">${project.file}</span></div>
          <h3>${project.title}</h3><p class="description">${project.description}</p>
          <div class="tags">${project.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
          <div class="actions"><a class="button primary" href="${project.file}">開啟完整頁面</a><a class="button secondary" href="${project.file}" target="_blank" rel="noopener" aria-label="在新分頁開啟 ${project.title}" title="在新分頁開啟">↗</a></div>
        </div></article>`;
    }

    function loadVisiblePreviews() {
      grid.querySelectorAll("iframe[data-src]").forEach(frame => {
        frame.addEventListener("load", () => frame.closest(".preview").classList.add("loaded"), { once: true });
        frame.src = frame.dataset.src;
        frame.removeAttribute("data-src");
      });
    }

    function renderProjects() {
      const group = groups[activeGroup];
      const query = searchInput.value.trim().toLowerCase();
      const groupProjects = projects.filter(project => project.group === activeGroup);
      const visibleProjects = groupProjects.filter(project => {
        const searchable = [project.title, project.file, project.type, project.description, ...project.tags].join(" ").toLowerCase();
        return !query || searchable.includes(query);
      });
      sectionTitle.textContent = group.label;
      sectionDescription.textContent = group.description;
      resultCount.textContent = query ? `${visibleProjects.length} / ${groupProjects.length} 個結果` : `共 ${groupProjects.length} 個頁面`;
      grid.innerHTML = visibleProjects.map(cardTemplate).join("");
      grid.style.display = visibleProjects.length ? "grid" : "none";
      emptyState.style.display = visibleProjects.length ? "none" : "block";
      loadVisiblePreviews();
    }

    function updateClearButton() { clearSearch.style.display = searchInput.value ? "block" : "none"; }
    searchInput.addEventListener("input", () => { updateClearButton(); renderProjects(); });
    clearSearch.addEventListener("click", () => { searchInput.value = ""; updateClearButton(); renderProjects(); searchInput.focus(); });
    renderTabs();
    renderProjects();
  </script>
</body>
</html>
